services:
  postgres:
    image: postgres:16-alpine
    container_name: lease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lease
      POSTGRES_PASSWORD: lease
      POSTGRES_DB: lease
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lease -d lease"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
